[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invostrata"
version = "1.0.0"
description = "INVOSTRATA — Automated Invoice Validation & Financial Consistency Workstation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "raguramrrp", email = "raguramrrp@gmail.com" }
]
keywords = [
    "fintech",
    "invoice-validation",
    "financial-consistency",
    "indian-gst",
    "document-intelligence",
    "accounting-automation",
    "three-way-matching"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
